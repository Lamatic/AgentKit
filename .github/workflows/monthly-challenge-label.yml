name: Create Monthly Challenge Label

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  issues: write   # needed to create labels

jobs:
  create-label:
    runs-on: ubuntu-latest
    steps:
      - name: Create this month's challenge label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          MONTH=$(date +%B | tr '[:upper:]' '[:lower:]')
          YEAR=$(date +%Y)
          LABEL="challenge: ${MONTH}-${YEAR}"

          COLORS=("F9A825" "26A69A" "8E24AA" "5C6BC0" "EF5350" "43A047")
          MONTH_NUM=$(date +%-m)
          COLOR=${COLORS[$(( (MONTH_NUM - 1) % 6 ))]}

          curl -s -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/labels" \
            -d "{\"name\":\"${LABEL}\",\"color\":\"${COLOR}\",\"description\":\"Contributions eligible for the ${MONTH^} ${YEAR} community challenge\"}"

          echo "Created label: ${LABEL} (color #${COLOR})"
