name: Tag PR with Monthly Challenge Label

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write   # only permission needed — never checks out PR code

jobs:
  tag-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure this month's label exists, then apply it to the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MONTH=$(date +%B | tr '[:upper:]' '[:lower:]')
          YEAR=$(date +%Y)
          LABEL="challenge: ${MONTH}-${YEAR}"

          COLORS=("F9A825" "26A69A" "8E24AA" "5C6BC0" "EF5350" "43A047")
          MONTH_NUM=$(date +%-m)
          COLOR=${COLORS[$(( (MONTH_NUM - 1) % 6 ))]}

          # Create the label if it doesn't exist yet (harmless 422 if it does)
          curl -s -o /dev/null -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/labels" \
            -d "{\"name\":\"${LABEL}\",\"color\":\"${COLOR}\",\"description\":\"Contributions eligible for the ${MONTH^} ${YEAR} community challenge\"}"

          # Apply the label to this PR
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/labels" \
            -d "{\"labels\":[\"${LABEL}\"]}"

          echo "Tagged PR #${PR_NUMBER} with ${LABEL}"
