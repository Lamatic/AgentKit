openapi: 3.0.0
info:
  title: Billing API
  version: 1.1.0
components:
  schemas:
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - active
            - banned
paths:
  /users:
    get:
      summary: List users
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
        - name: tenant
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    post:
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                name:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Created
