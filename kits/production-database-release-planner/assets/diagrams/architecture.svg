<svg width="980" height="1300" viewBox="0 0 980 1300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AI Database Release Planner architecture</title>
<desc>Sequential multi-agent pipeline with explicit JSON enrichment stages: SQL migration input flows through migration JSON, behavior JSON, deployment JSON, and the final release report.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="980" height="1300" fill="#ffffff"/>
<style>
.title{font:700 22px -apple-system,Segoe UI,Roboto,sans-serif;fill:#0f172a}
.sub{font:400 12px -apple-system,Segoe UI,Roboto,sans-serif;fill:#475569}
.head{font:700 15px -apple-system,Segoe UI,Roboto,sans-serif;fill:#0f172a}
.body{font:400 12px -apple-system,Segoe UI,Roboto,sans-serif;fill:#334155}
.arr{stroke:#64748b;stroke-width:1.6;fill:none}
.input{fill:#e0f2fe;stroke:#0284c7}
.agent{fill:#f1f5f9;stroke:#64748b}
.artifact{fill:#fef3c7;stroke:#d97706}
.final{fill:#dcfce7;stroke:#16a34a}
</style>

<text class="title" x="40" y="42">AI Database Release Planner</text>
<text class="sub" x="40" y="64">Sequential multi-agent release review with explicit JSON enrichment between stages</text>

<line x1="490" y1="174" x2="490" y2="246" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="316" x2="490" y2="388" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="458" x2="490" y2="530" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="600" x2="490" y2="672" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="742" x2="490" y2="814" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="884" x2="490" y2="956" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="1026" x2="490" y2="1098" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="160" y="90" width="660" height="84" rx="12" class="input" stroke-width="1"/>
<text class="head" x="490" y="125" text-anchor="middle">SQL Migration Input</text>
<text class="body" x="490" y="147" text-anchor="middle">Source migration script</text>
</g>

<g>
<rect x="160" y="246" width="660" height="84" rx="12" class="agent" stroke-width="1"/>
<text class="head" x="490" y="281" text-anchor="middle">Migration Understanding Agent</text>
<text class="body" x="490" y="303" text-anchor="middle">Produces migration JSON summary</text>
</g>

<g>
<rect x="220" y="388" width="540" height="84" rx="12" class="artifact" stroke-width="1"/>
<text class="head" x="490" y="423" text-anchor="middle">Migration JSON</text>
<text class="body" x="490" y="445" text-anchor="middle">Schema operations, affected tables, destructive changes</text>
</g>

<g>
<rect x="160" y="530" width="660" height="84" rx="12" class="agent" stroke-width="1"/>
<text class="head" x="490" y="565" text-anchor="middle">Database Behavior Evaluator</text>
<text class="body" x="490" y="587" text-anchor="middle">Appends PostgreSQL runtime behavior analysis</text>
</g>

<g>
<rect x="220" y="672" width="540" height="84" rx="12" class="artifact" stroke-width="1"/>
<text class="head" x="490" y="707" text-anchor="middle">Behavior JSON</text>
<text class="body" x="490" y="729" text-anchor="middle">Locks, rewrites, blocking risk, production risk</text>
</g>

<g>
<rect x="160" y="814" width="660" height="84" rx="12" class="agent" stroke-width="1"/>
<text class="head" x="490" y="849" text-anchor="middle">Deployment Strategy Planner</text>
<text class="body" x="490" y="871" text-anchor="middle">Appends release order and downtime guidance</text>
</g>

<g>
<rect x="220" y="956" width="540" height="84" rx="12" class="artifact" stroke-width="1"/>
<text class="head" x="490" y="991" text-anchor="middle">Deployment JSON</text>
<text class="body" x="490" y="1013" text-anchor="middle">Safest deployment approach, maintenance window, rollback notes</text>
</g>

<g>
<rect x="160" y="1098" width="660" height="84" rx="12" class="final" stroke-width="1"/>
<text class="head" x="490" y="1130" text-anchor="middle">Release Decision &amp; Rollback Advisor</text>
<text class="body" x="490" y="1152" text-anchor="middle">Final Release Report + Rollback Strategy + Deployment Recommendation</text>
</g>

<g>
<rect x="90" y="1226" width="800" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text class="body" x="490" y="1252" text-anchor="middle">Each agent enriches the previous JSON without modifying earlier outputs, ensuring traceability and separation of concerns.</text>
</g>
</svg>